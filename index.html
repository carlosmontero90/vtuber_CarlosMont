<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#00b140">
<title>VTuber Multi-Modelo</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #00b140;
    color: #fff;
    user-select: none;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    background: var(--bg-color, #00b140);
    transition: background 0.3s;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  #top-bar {
    flex-shrink: 0;
    padding: 8px 10px 8px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
    z-index: 10;
  }

  #character-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .character-btn {
    flex: 1;
    padding: 11px 0;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }
  .character-btn.active {
    background: #fff;
    color: #00b140;
    border-color: #fff;
  }

  #btn-settings {
    flex-shrink: 0;
    width: 52px;
    font-size: 22px;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
    line-height: 1;
  }
  #btn-settings:active { background: rgba(255,255,255,0.28); }

  /* === BARRA DE GRABACIÓN === */
  #rec-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .rec-btn {
    flex: 1;
    padding: 9px 0;
    font-size: 13px;
    font-weight: 700;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .rec-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .rec-btn.active {
    background: #dc2626;
    color: #fff;
    border-color: #fff;
  }
  .rec-btn.paused {
    background: #f59e0b;
    color: #fff;
    border-color: #fff;
  }
  #rec-indicator {
    position: absolute;
    top: 4px; right: 6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
    display: none;
    animation: recPulse 1s infinite;
  }
  #rec-row.recording #rec-indicator { display: block; }
  @keyframes recPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  #rec-timer {
    position: absolute;
    top: 4px; left: 8px;
    font-size: 10px;
    opacity: 0.8;
    display: none;
    font-variant-numeric: tabular-nums;
  }
  #rec-row.recording #rec-timer { display: block; }

  #form-buttons {
    display: flex;
    gap: 5px;
  }
  .form-btn {
    flex: 1;
    min-width: 0;
    padding: 10px 2px;
    font-size: 12px;
    font-weight: 600;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .form-btn.active {
    background: rgba(255,255,255,0.9);
    color: #00b140;
    border-color: #fff;
  }
  .form-btn .dot {
    position: absolute;
    top: 3px; right: 4px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    display: none;
  }
  .form-btn.has-content .dot { display: block; }

  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }
  #avatar-wrapper {
    will-change: transform;
    transform: translate3d(0,0,0);
  }
  #avatar-image {
    max-width: 88vw;
    max-height: 62vh;
    object-fit: contain;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
  }

  #settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #settings-overlay.open { display: flex; }

  #settings-sheet {
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    max-height: 88dvh;
    background: #1f2937;
    color: #fff;
    border-bottom-left-radius: 22px;
    border-bottom-right-radius: 22px;
    padding: 14px 18px 26px;
    padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    animation: slideDown 0.22s ease-out;
  }
  @keyframes slideDown {
    from { transform: translateY(-30px); opacity: 0.5; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  #settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    position: sticky;
    top: -14px;
    background: #1f2937;
    padding: 8px 0;
    z-index: 1;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #settings-header h2 {
    font-size: 16px;
    margin: 0;
    font-weight: 700;
  }
  #btn-close-settings {
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    font-size: 16px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.6;
    margin: 16px 0 8px;
    font-weight: 700;
  }

  .control { margin-bottom: 12px; }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 3px;
    opacity: 0.95;
  }
  .control input[type="range"] {
    width: 100%;
    height: 26px;
    -webkit-appearance: none;
    background: transparent;
  }
  .control input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
  }
  .control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #fff;
    margin-top: -9px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-row input[type="color"] {
    width: 48px; height: 34px;
    border: none; border-radius: 8px;
    background: transparent;
    cursor: pointer;
  }

  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .action-btn {
    flex: 1;
    min-width: 130px;
    padding: 12px;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: #4ade80;
    color: #0f172a;
    cursor: pointer;
  }
  .action-btn.rec { background: #f87171; color: #fff; }
  .action-btn.danger { background: #dc2626; color: #fff; }
  .action-btn.secondary {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
  }

  .permission-box {
    background: rgba(255,80,80,0.2);
    border: 1px solid rgba(255,120,120,0.6);
    border-radius: 12px;
    padding: 12px;
    margin-top: 10px;
    font-size: 12.5px;
    line-height: 1.45;
    display: none;
  }
  .permission-box.visible { display: block; }
  .permission-box strong { display: block; margin-bottom: 6px; font-size: 13px; }
  .permission-box ol { margin: 6px 0 8px 18px; padding: 0; }
  .permission-box li { margin-bottom: 4px; }
  .permission-box button {
    background: #fff;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-right: 6px;
  }

  #mic-bar {
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  #mic-level {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4ade80, #facc15, #f87171);
    transition: width 0.05s;
  }

  #hint {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.78);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    text-align: center;
    max-width: 90vw;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 100;
  }
  #hint.show { opacity: 1; }

  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 6px;
  }
  .thumb {
    aspect-ratio: 1;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb.filled { border-color: #4ade80; }
  .thumb.from-github { border-color: #60a5fa; }
  .thumb .label {
    position: absolute;
    bottom: 2px; left: 2px;
    font-size: 9px;
    background: rgba(0,0,0,0.7);
    padding: 1px 4px;
    border-radius: 3px;
  }
  .thumb input { display: none; }

  #storage-info {
    font-size: 11px;
    opacity: 0.75;
    margin-top: 4px;
    line-height: 1.4;
  }
  .legend {
    font-size: 10px;
    opacity: 0.65;
    margin-top: 4px;
  }
  .legend span { display: inline-block; margin-right: 10px; }
  .legend .c1 { color: #60a5fa; }
  .legend .c2 { color: #4ade80; }

  /* Panel de grabación */
  #rec-status {
    font-size: 12px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    padding: 10px 12px;
    line-height: 1.5;
  }
  #rec-status b { color: #4ade80; }
  #rec-status .warn { color: #fbbf24; }
  #rec-status .err  { color: #f87171; }
</style>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <div id="character-row">
      <button class="character-btn active" data-char="sentado">Sentado</button>
      <button class="character-btn" data-char="parado">Parado</button>
      <button id="btn-settings" title="Ajustes">⚙️</button>
    </div>

    <!-- === NUEVA FILA DE GRABACIÓN === -->
    <div id="rec-row">
      <button class="rec-btn" id="btn-rec-start">🎬<span id="rec-timer">00:00</span></button>
      <button class="rec-btn" id="btn-rec-pause" disabled>⏸ Pausar</button>
      <button class="rec-btn" id="btn-rec-stop" disabled>⏹ Detener</button>
      <span id="rec-indicator"></span>
    </div>

    <div id="form-buttons">
      <button class="form-btn active" data-form="1">F1<span class="dot"></span></button>
      <button class="form-btn" data-form="2">F2<span class="dot"></span></button>
      <button class="form-btn" data-form="3">F3<span class="dot"></span></button>
      <button class="form-btn" data-form="4">F4<span class="dot"></span></button>
      <button class="form-btn" data-form="5">F5<span class="dot"></span></button>
    </div>
  </div>

  <div id="stage">
    <div id="avatar-wrapper">
      <img id="avatar-image" alt="avatar" src="" />
    </div>
    <div id="hint"></div>
  </div>
</div>

<div id="settings-overlay">
  <div id="settings-sheet">
    <div id="settings-header">
      <h2>⚙️ Ajustes</h2>
      <button id="btn-close-settings">✕ Cerrar</button>
    </div>

    <!-- GRABACIÓN -->
    <div class="section-title">🎥 Grabación</div>
    <div id="rec-status">—</div>
    <div class="action-row">
      <button class="action-btn secondary" id="btn-rec-info">ℹ️ ¿Cómo funciona?</button>
      <button class="action-btn secondary" id="btn-rec-test">🔎 Detectar soporte</button>
    </div>

    <!-- MICRÓFONO -->
    <div class="section-title">Micrófono</div>
    <div class="control">
      <label>Nivel de entrada</label>
      <div id="mic-bar"><div id="mic-level"></div></div>
    </div>
    <div class="control">
      <label>Sensibilidad <span id="val-sens">50</span></label>
      <input type="range" id="sens" min="1" max="100" value="50">
    </div>
    <div class="action-row">
      <button class="action-btn" id="btn-mic">🎤 Activar micrófono</button>
    </div>

    <div class="permission-box" id="perm-box">
      <strong id="perm-title">⚠️ Permiso denegado</strong>
      <div id="perm-body"></div>
      <button id="perm-retry">🔄 Reintentar</button>
      <button id="perm-reload">↻ Recargar</button>
    </div>

    <!-- ANIMACIÓN -->
    <div class="section-title">Animación</div>
    <div class="control">
      <label>Velocidad de parpadeo <span id="val-blink">3500 ms</span></label>
      <input type="range" id="blink" min="500" max="8000" value="3500" step="100">
    </div>
    <div class="control">
      <label>Oscilación vertical <span id="val-oscv">2 px</span></label>
      <input type="range" id="oscv" min="0" max="20" value="2" step="0.5">
    </div>
    <div class="control">
      <label>Oscilación horizontal <span id="val-oscx">0 px</span></label>
      <input type="range" id="oscx" min="0" max="20" value="0" step="0.5">
    </div>
    <div class="control">
      <label>Vibración <span id="val-vib">0.3 px</span></label>
      <input type="range" id="vib" min="0" max="3" value="0.3" step="0.1">
    </div>
    <div class="control">
      <label>Velocidad de oscilación <span id="val-osct">1.0x</span></label>
      <input type="range" id="osct" min="0.1" max="3" value="1" step="0.1">
    </div>

    <!-- FONDO -->
    <div class="section-title">Color de fondo</div>
    <div class="control">
      <div class="color-row">
        <input type="color" id="bgcolor" value="#00b140">
        <span style="font-size:12px;opacity:.8">Verde croma por defecto</span>
      </div>
    </div>

    <!-- IMÁGENES -->
    <div class="section-title">
      Imágenes: <span id="current-slot-name">Sentado · F1</span>
    </div>
    <div class="control">
      <div class="thumb-grid" id="thumb-grid">
        <label class="thumb" data-pose="AA"><img alt=""><span class="label">AA</span><input type="file" accept="image/*"></label>
        <label class="thumb" data-pose="AB"><img alt=""><span class="label">AB</span><input type="file" accept="image/*"></label>
        <label class="thumb" data-pose="BA"><img alt=""><span class="label">BA</span><input type="file" accept="image/*"></label>
        <label class="thumb" data-pose="BB"><img alt=""><span class="label">BB</span><input type="file" accept="image/*"></label>
      </div>
      <p class="legend">
        <span class="c1">● azul</span> = cargada desde GitHub
        <span class="c2">● verde</span> = cargada desde el celular
      </p>
      <div class="action-row" style="margin-top:8px">
        <button class="action-btn secondary" id="btn-bulk">📁 Cargar 4 desde celu</button>
        <button class="action-btn secondary" id="btn-clear">🧹 Limpiar este slot</button>
      </div>
      <input type="file" id="bulk-input" accept="image/*" multiple style="display:none">
    </div>

    <!-- ALMACENAMIENTO -->
    <div class="section-title">Almacenamiento</div>
    <div id="storage-info">—</div>
    <div class="action-row">
      <button class="action-btn secondary" id="btn-reload-github">🔄 Recargar desde GitHub</button>
      <button class="action-btn danger" id="btn-wipe">🗑️ Borrar TODO</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const STORAGE_KEY = 'vtuber_multi_v1';
const ASSETS_PATH = 'assets/';
const MAX_IMG_SIDE = 512;
const JPEG_QUALITY = 0.75;

const CHARACTERS = [
  { id: 'sentado', label: 'Sentado', fileBase: 'sentado' },
  { id: 'parado',  label: 'Parado',  fileBase: 'parado'  }
];
const FORMS = [1, 2, 3, 4, 5];
const POSES = ['AA', 'AB', 'BA', 'BB'];

/* ============================================================
   ESTADO
   ============================================================ */
const STATE = {
  charIndex: 0,
  formIndex: 0,
  eyesOpen: true,
  mouthOpen: false,
  sensitivity: 50,
  blinkInterval: 3500,
  oscVertical: 2,
  oscHorizontal: 0,
  vibration: 0.3,
  oscSpeed: 1.0,
  bgColor: '#00b140',
  settingsOpen: false,
  slots: {}
};

function initSlots() {
  CHARACTERS.forEach(c => {
    STATE.slots[c.id] = {};
    FORMS.forEach(f => {
      STATE.slots[c.id][f] = { AA: null, AB: null, BA: null, BB: null };
    });
  });
}

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const avatarImg   = $('avatar-image');
const avatarWrap  = $('avatar-wrapper');
const appEl       = $('app');
const micLevel    = $('mic-level');
const hintEl      = $('hint');
const charBtns    = document.querySelectorAll('.character-btn');
const formBtns    = document.querySelectorAll('.form-btn');
const thumbGrid   = $('thumb-grid');
const currentSlotName = $('current-slot-name');
const btnMic      = $('btn-mic');
const permBox     = $('perm-box');
const permTitle   = $('perm-title');
const permBody    = $('perm-body');
const storageInfo = $('storage-info');
const overlay     = $('settings-overlay');
const btnSettings = $('btn-settings');
const btnCloseSet = $('btn-close-settings');

/* ============================================================
   HELPERS DE SLOT
   ============================================================ */
function currentCharId() { return CHARACTERS[STATE.charIndex].id; }
function currentFormNum() { return FORMS[STATE.formIndex]; }
function currentSlot() {
  return STATE.slots[currentCharId()][currentFormNum()];
}

/* ============================================================
   PERSISTENCIA
   ============================================================ */
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStateNow, 400);
}

function saveStateNow() {
  try {
    const compact = {};
    CHARACTERS.forEach(c => {
      compact[c.id] = {};
      FORMS.forEach(f => {
        compact[c.id][f] = {};
        POSES.forEach(p => {
          const slot = STATE.slots[c.id][f][p];
          if (slot && slot.source === 'user') {
            compact[c.id][f][p] = slot.src;
          }
        });
      });
    });

    const payload = {
      charIndex: STATE.charIndex,
      formIndex: STATE.formIndex,
      sensitivity: STATE.sensitivity,
      blinkInterval: STATE.blinkInterval,
      oscVertical: STATE.oscVertical,
      oscHorizontal: STATE.oscHorizontal,
      vibration: STATE.vibration,
      oscSpeed: STATE.oscSpeed,
      bgColor: STATE.bgColor,
      userSlots: compact
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    updateStorageInfo();
  } catch (err) {
    console.warn('Save error:', err);
    if (err.name === 'QuotaExceededError' || err.code === 22) {
      showHint('⚠️ Almacenamiento lleno. Usa imágenes más livianas o borra slots.');
    }
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    STATE.charIndex = data.charIndex ?? 0;
    STATE.formIndex = data.formIndex ?? 0;
    STATE.sensitivity = data.sensitivity ?? 50;
    STATE.blinkInterval = data.blinkInterval ?? 3500;
    STATE.oscVertical = data.oscVertical ?? 2;
    STATE.oscHorizontal = data.oscHorizontal ?? 0;
    STATE.vibration = data.vibration ?? 0.3;
    STATE.oscSpeed = data.oscSpeed ?? 1;
    STATE.bgColor = data.bgColor ?? '#00b140';

    if (data.userSlots) {
      CHARACTERS.forEach(c => {
        const charData = data.userSlots[c.id];
        if (!charData) return;
        FORMS.forEach(f => {
          const formData = charData[f];
          if (!formData) return;
          POSES.forEach(p => {
            if (formData[p]) {
              STATE.slots[c.id][f][p] = { src: formData[p], source: 'user' };
            }
          });
        });
      });
    }
    return true;
  } catch (err) {
    console.warn('Load error:', err);
    return false;
  }
}

function updateStorageInfo() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || '';
    const kb = (raw.length / 1024).toFixed(1);
    let ghCount = 0, userCount = 0, emptyCount = 0;
    CHARACTERS.forEach(c => {
      FORMS.forEach(f => {
        POSES.forEach(p => {
          const slot = STATE.slots[c.id][f][p];
          if (!slot || !slot.src) emptyCount++;
          else if (slot.source === 'github') ghCount++;
          else userCount++;
        });
      });
    });
    storageInfo.innerHTML =
      `GitHub: <b>${ghCount}</b> · Celular: <b>${userCount}</b> · Vacías: <b>${emptyCount}</b><br>` +

/* ============================================================
   COMPRESIÓN DE IMAGEN
   ============================================================ */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const max = MAX_IMG_SIDE;
        if (width > max || height > max) {
          if (width > height) { height = Math.round(height * max / width); width = max; }
          else { width = Math.round(width * max / height); height = max; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   MOVIMIENTO
   ============================================================ */
let phase = 0;
let vibTargetX = 0, vibTargetY = 0;
let vibCurrentX = 0, vibCurrentY = 0;
let lastVibUpdate = 0;
let frozenTransform = 'translate3d(0,0,0)';

function motionLoop(now) {
  now = now || performance.now();

  if (STATE.settingsOpen) {
    avatarWrap.style.transform = frozenTransform;
    requestAnimationFrame(motionLoop);
    return;
  }

  phase += 0.04 * STATE.oscSpeed;

  const yOsc = Math.sin(phase) * STATE.oscVertical;
  const xOsc = Math.cos(phase * 0.8) * STATE.oscHorizontal;

  if (now - lastVibUpdate > 80) {
    lastVibUpdate = now;
    const amp = STATE.vibration * 0.5;
    vibTargetX = (Math.random() - 0.5) * 2 * amp;
    vibTargetY = (Math.random() - 0.5) * 2 * amp;
  }
  vibCurrentX += (vibTargetX - vibCurrentX) * 0.15;
  vibCurrentY += (vibTargetY - vibCurrentY) * 0.15;

  frozenTransform = `translate3d(${xOsc + vibCurrentX}px, ${yOsc + vibCurrentY}px, 0)`;
  avatarWrap.style.transform = frozenTransform;

  requestAnimationFrame(motionLoop);
}

   ============================================================ */
let audioCtx = null, analyser = null, dataArray = null, micStream = null, micActive = false;

async function checkPermission() {
  if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
  try {
    const status = await navigator.permissions.query({ name: 'microphone' });
    return status.state;
  } catch { return 'unknown'; }
}

function showPermissionHelp(title, bodyHtml) {
  permTitle.textContent = title;
  permBody.innerHTML = bodyHtml;
  permBox.classList.add('visible');
}
function hidePermissionHelp() { permBox.classList.remove('visible'); }

async function activarMicrofono() {
  hidePermissionHelp();
  const permState = await checkPermission();
  if (permState === 'denied') {
    showPermissionHelp(
      '🚫 Permiso bloqueado previamente',
      `Toca el <b>candado 🔒</b> o <b>ⓘ</b> junto a la URL → <b>Permisos</b> → <b>Micrófono</b> → <b>Permitir</b>.<br>Luego recarga.`
    );
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.fftSize);

    micActive = true;
    btnMic.textContent = '🔴 Micrófono activo (toca para detener)';
    btnMic.classList.add('rec');
    showHint('Micrófono activo');
    medirAudio();
  } catch (err) {
    console.error(err);
    let msg = 'Error: ' + err.message;
    if (err.name === 'NotAllowedError') {
      msg = 'Permiso rechazado. Toca el candado 🔒 y cámbialo a <b>Permitir</b>. Verifica que la URL sea <b>https://</b>.';
    } else if (err.name === 'NotFoundError') msg = 'No se encontró micrófono.';
    else if (err.name === 'NotReadableError') msg = 'El micrófono está en uso por otra app.';
    showPermissionHelp('⚠️ No se pudo activar', msg);
  }
}

function medirAudio() {
  if (!micActive) return;
  analyser.getByteTimeDomainData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = (dataArray[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / dataArray.length);
  micLevel.style.width = Math.min(100, rms * 250) + '%';
  const threshold = 0.35 - (STATE.sensitivity / 100) * 0.33;
  const shouldOpen = rms > threshold;
  if (shouldOpen !== STATE.mouthOpen) {
    STATE.mouthOpen = shouldOpen;
    actualizarAvatar();
  }
  requestAnimationFrame(medirAudio);
}

/* ============================================================
   📹 GRABACIÓN DE PANTALLA + MICRÓFONO
   ============================================================ */
const REC = {
  recorder: null,
  chunks: [],
  displayStream: null,
  micStreamRec: null,
  mixedStream: null,
  combinedStream: null,
  mixingCtx: null,
  state: 'idle',      // idle | recording | paused
  startedAt: 0,
  pausedTotal: 0,
  pausedAt: 0,
  timerInterval: null,
  mimeType: ''
};

const btnRecStart = $('btn-rec-start');
const btnRecPause = $('btn-rec-pause');
const btnRecStop  = $('btn-rec-stop');
const recRow      = $('rec-row');
const recTimer    = $('rec-timer');
const recStatus   = $('rec-status');

/* --- Detectar mejor MIME soportado --- */
function pickMimeType() {
  const candidates = [
    'video/mp4;codecs=h264,aac',
    'video/mp4;codecs=avc1,mp4a',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

/* --- Mezclar video de pantalla + audio del micrófono --- */
async function buildCombinedStream(displayStream, micStream) {
  const combined = new MediaStream();
  // pista de video
  displayStream.getVideoTracks().forEach(t => combined.addTrack(t));

  // Mezclar audio: creamos un AudioContext y un MediaStreamDestination
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();
  if (ctx.state === 'suspended') await ctx.resume();
  const dest = ctx.createMediaStreamDestination();

  // Audio del micrófono
  if (micStream) {
    const micSource = ctx.createMediaStreamSource(micStream);
    const micGain = ctx.createGain();
    micGain.gain.value = 1.0;
    micSource.connect(micGain).connect(dest);
  }

  // Audio del sistema (si la pantalla comparte audio)
  const sysAudioTracks = displayStream.getAudioTracks();
  if (sysAudioTracks.length) {
    const sysStream = new MediaStream(sysAudioTracks);
    const sysSource = ctx.createMediaStreamSource(sysStream);
    const sysGain = ctx.createGain();
    sysGain.gain.value = 0.25;   // bajito para que no tape la voz
    sysSource.connect(sysGain).connect(dest);
  }

  // Añadimos la pista de audio mezclada
  dest.stream.getAudioTracks().forEach(t => combined.addTrack(t));

  REC.mixingCtx = ctx;
  return combined;
}

/* --- Formatear mm:ss --- */
function fmtTime(ms) {
  const total = Math.floor(ms / 1000);
  const m = String(Math.floor(total / 60)).padStart(2, '0');
  const s = String(total % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function updateRecTimer() {
  if (REC.state !== 'recording' && REC.state !== 'paused') {
    recTimer.textContent = '00:00';
    return;
  }
  let elapsed = performance.now() - REC.startedAt - REC.pausedTotal;
  if (REC.state === 'paused') elapsed -= (performance.now() - REC.pausedAt);
  recTimer.textContent = fmtTime(Math.max(0, elapsed));
}

function setRecUI(state) {
  REC.state = state;
  recRow.classList.toggle('recording', state === 'recording' || state === 'paused');
  recRow.classList.toggle('paused', state === 'paused');

  btnRecStart.disabled = state !== 'idle';
  btnRecPause.disabled = state === 'idle';
  btnRecStop.disabled  = state === 'idle';

  if (state === 'idle') {
    btnRecStart.classList.remove('active');
    btnRecPause.classList.remove('active', 'paused');
    btnRecPause.textContent = '⏸ Pausar';
    recStatus.innerHTML = 'Listo para grabar. Pulsa <b>🎬</b>.';
  } else if (state === 'recording') {
    btnRecStart.classList.add('active');
    btnRecPause.classList.remove('paused');
    btnRecPause.textContent = '⏸ Pausar';
    recStatus.innerHTML = '<b>● Grabando...</b> Pulsa ⏸ para pausar o ⏹ para detener y descargar.';
  } else if (state === 'paused') {
    btnRecStart.classList.add('active');
    btnRecPause.classList.add('paused');
    btnRecPause.textContent = '▶ Reanudar';
    recStatus.innerHTML = '<b>⏸ En pausa.</b> Pulsa ▶ para continuar o ⏹ para detener y descargar.';
  }
}

/* --- Iniciar grabación --- */
async function startRecording() {
  if (REC.state !== 'idle') return;

  // Verificar soporte
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    alert('❌ Tu navegador no soporta captura de pantalla (getDisplayMedia).\n\n' +
          'En iPhone/iPad, Safari NO permite capturar la pantalla desde una web. ' +
          'Usa Android + Chrome, o graba con el Centro de Control de iOS.');
    recStatus.innerHTML = '<span class="err">❌ getDisplayMedia no soportado en este navegador.</span>';
    return;
  }
  if (!window.MediaRecorder) {
    alert('❌ Tu navegador no soporta MediaRecorder.');
    return;
  }

  const mime = pickMimeType();
  REC.mimeType = mime;
  console.log('MIME elegido:', mime || '(por defecto)');

  try {
    // 1) Capturar pantalla
    showHint('Elige "Esta pestaña" o "Pantalla completa"...');
    const displayStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: { ideal: 30, max: 60 },
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: true   // intenta capturar audio del sistema (Chrome desktop lo permite)
    });
    REC.displayStream = displayStream;

    // 2) Micrófono
    let micStream = null;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });
      REC.micStreamRec = micStream;
    } catch (e) {
      console.warn('Micrófono no disponible para grabación:', e);
      showHint('⚠️ Sin micrófono: se grabará solo video');
    }

    // 3) Combinar
    const combined = await buildCombinedStream(displayStream, micStream);
    REC.combinedStream = combined;

    // Si el usuario detiene la compartición desde la barra del navegador
    displayStream.getVideoTracks()[0].addEventListener('ended', () => {
      if (REC.state !== 'idle') stopRecording();
    });

    // 4) MediaRecorder
    const options = mime ? { mimeType: mime, videoBitsPerSecond: 4_000_000 } : { videoBitsPerSecond: 4_000_000 };
    const recorder = new MediaRecorder(combined, options);
    REC.recorder = recorder;
    REC.chunks = [];

    recorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) REC.chunks.push(e.data);
    };

    recorder.onstop = () => {
      const type = recorder.mimeType || mime || 'video/webm';
      const blob = new Blob(REC.chunks, { type });
      const ext = type.includes('mp4') ? 'mp4' : 'webm';
      const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      const filename = `vtuber_${ts}.${ext}`;

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);

      showHint(`✅ Guardado: ${filename}`);
      recStatus.innerHTML = `✅ Guardado <b>${filename}</b><br>Tamaño: ${(blob.size/1024/1024).toFixed(2)} MB`;
      cleanupRecording();
      setRecUI('idle');
    };

    recorder.onerror = e => {
      console.error('Recorder error:', e);
      showHint('Error de grabación');
      cleanupRecording();
      setRecUI('idle');
    };

    // 5) Arrancar
    recorder.start(1000); // chunk cada 1s
    REC.startedAt = performance.now();
    REC.pausedTotal = 0;
    clearInterval(REC.timerInterval);
    REC.timerInterval = setInterval(updateRecTimer, 250);
    setRecUI('recording');
    showHint('🔴 Grabando. Vuelve a la app (no cierres la pestaña).');
  } catch (err) {
    console.error('startRecording error:', err);
    cleanupRecording();
    setRecUI('idle');
    if (err.name === 'NotAllowedError') {
      showHint('Permiso de captura cancelado');
      recStatus.innerHTML = '<span class="warn">⚠️ Cancelaste la selección de pantalla.</span>';
    } else {
      alert('Error al iniciar grabación: ' + err.message);
    }
  }
}

/* --- Pausar / Reanudar --- */
function togglePauseRecording() {
  if (!REC.recorder) return;
  if (REC.state === 'recording') {
    REC.recorder.pause();
    REC.pausedAt = performance.now();
    setRecUI('paused');
    showHint('⏸ Grabación en pausa');
  } else if (REC.state === 'paused') {
    REC.recorder.resume();
    REC.pausedTotal += performance.now() - REC.pausedAt;
    setRecUI('recording');
    showHint('▶ Grabación reanudada');
  }
}

/* --- Detener --- */
function stopRecording() {
  if (!REC.recorder) return;
  if (REC.recorder.state !== 'inactive') {
    try { REC.recorder.stop(); } catch (e) { console.warn(e); }
  }
  clearInterval(REC.timerInterval);
  showHint('Procesando video...');
}

/* --- Limpieza --- */
function cleanupRecording() {
  clearInterval(REC.timerInterval);
  try {
    if (REC.displayStream) REC.displayStream.getTracks().forEach(t => t.stop());
    if (REC.micStreamRec)  REC.micStreamRec.getTracks().forEach(t => t.stop());
    if (REC.combinedStream) REC.combinedStream.getTracks().forEach(t => t.stop());
    if (REC.mixingCtx && REC.mixingCtx.state !== 'closed') REC.mixingCtx.close();
  } catch (e) { console.warn(e); }
  REC.recorder = null;
  REC.displayStream = null;
  REC.micStreamRec = null;
  REC.combinedStream = null;
  REC.mixingCtx = null;
  REC.chunks = [];
}

/* --- Botones --- */
btnRecStart.addEventListener('click', startRecording);
btnRecPause.addEventListener('click', togglePauseRecording);
btnRecStop .addEventListener('click', stopRecording);

/* --- Botón de info --- */
$('btn-rec-info').addEventListener('click', () => {
  alert(
    '🎥 ¿Cómo grabar?\n\n' +
    '1. Pulsa el botón 🎬 (arriba).\n' +
    '2. El navegador te pedirá elegir qué compartir: selecciona "Esta pestaña" para grabar solo esta app.\n' +
    '3. Acepta el permiso de micrófono.\n' +
    '4. Habla y mueve el avatar: se graba video + tu voz.\n' +
    '5. Pulsa ⏸ para pausar, ▶ para reanudar, ⏹ para terminar.\n' +
    '6. El archivo se descarga automáticamente (.mp4 si el navegador lo soporta, si no .webm).\n\n' +
    '⚠️ iPhone/iPad (Safari): la captura de pantalla NO está disponible en la web. Usa Android+Chrome, o la grabación nativa del Centro de Control.'
  );
});

/* --- Detección de soporte --- */
$('btn-rec-test').addEventListener('click', () => {
  const hasDisplay = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  const hasRec = !!window.MediaRecorder;
  const mime = pickMimeType();
  const mp4 = mime.includes('mp4');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  recStatus.innerHTML =
    `getDisplayMedia: <b>${hasDisplay ? 'SÍ' : 'NO'}</b><br>` +
    `MediaRecorder: <b>${hasRec ? 'SÍ' : 'NO'}</b><br>` +
    `Formato elegido: <b>${mime || 'por defecto'}</b> ${mp4 ? '(.mp4 ✅)' : '(.webm)'}<br>` +
    `Sistema: <b>${isIOS ? 'iOS (sin captura web)' : 'Android/Desktop'}</b>`;
});

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  initSlots();
  const hadSave = loadState();

  document.documentElement.style.setProperty('--bg-color', STATE.bgColor);
  appEl.style.background = STATE.bgColor;
  $('bgcolor').value = STATE.bgColor;
  $('sens').value = STATE.sensitivity;      $('val-sens').textContent = STATE.sensitivity;
  $('blink').value = STATE.blinkInterval;   $('val-blink').textContent = STATE.blinkInterval + ' ms';
  $('oscv').value = STATE.oscVertical;      $('val-oscv').textContent = STATE.oscVertical + ' px';
  $('oscx').value = STATE.oscHorizontal;    $('val-oscx').textContent = STATE.oscHorizontal + ' px';
  $('vib').value = STATE.vibration;         $('val-vib').textContent = STATE.vibration.toFixed(1) + ' px';
  $('osct').value = STATE.oscSpeed;         $('val-osct').textContent = STATE.oscSpeed.toFixed(1) + 'x';

  charBtns.forEach((b, i) => b.classList.toggle('active', i === STATE.charIndex));
  formBtns.forEach((b, i) => b.classList.toggle('active', i === STATE.formIndex));

  refreshThumbs();
  actualizarAvatar();
  refreshFormDots();
  updateStorageInfo();
  scheduleBlink();
  requestAnimationFrame(motionLoop);

  tryLoadFromGithub();
  setRecUI('idle');

  showHint(hadSave
    ? 'Estado restaurado · cargando assets de GitHub...'
    : 'Cargando assets de GitHub...');

  const p = await checkPermission();
  if (p === 'denied') {
    showPermissionHelp(
      '🚫 Micrófono bloqueado',
      `Toca el <b>candado 🔒</b> junto a la URL y cámbialo a <b>"Permitir"</b>, luego recarga.`
    );
  }
}
init();
</script>
