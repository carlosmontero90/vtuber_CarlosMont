<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#00b140">
<title>VTuber Multi-Modelo</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #00b140;
    color: #fff;
    user-select: none;
    overscroll-behavior: none;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    background: var(--bg-color, #00b140);
    transition: background 0.3s;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  #top-bar {
    flex-shrink: 0;
    padding: 8px 10px 8px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
    z-index: 10;
  }

  #main-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .main-btn {
    flex: 1;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 700;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }
  .main-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #btn-settings {
    flex: 0 0 52px;
    font-size: 20px;
    padding: 8px 0;
  }

  #audio-row {
    display: flex;
    gap: 6px;
    margin-bottom: 4px;
    align-items: stretch;
  }
  .audio-btn {
    flex: 1;
    padding: 9px 0;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }
  .audio-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .audio-btn.active-blue { background: #60a5fa; border-color: #fff; }
  .audio-btn.active-green { background: #4ade80; color: #0f172a; border-color: #fff; }
  .audio-btn.active-red { background: #f87171; color: #fff; border-color: #fff; }

  #audio-progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    padding: 0 2px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.85);
  }
  #audio-progress {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  #audio-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #60a5fa, #4ade80);
    transition: width 0.1s linear;
    pointer-events: none;
  }
  #audio-progress-row.disabled { opacity: 0.35; }
  #audio-progress-row.disabled #audio-progress { cursor: not-allowed; }
  #audio-cur, #audio-dur { min-width: 38px; text-align: center; }

  #status-row {
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    text-align: center;
    padding: 2px 0 0;
    min-height: 14px;
  }
  #status-row .sync-badge {
    display: inline-block;
    background: #4ade80;
    color: #0f172a;
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: 700;
    margin-left: 4px;
  }

  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }
  #avatar-wrapper {
    will-change: transform;
    transform: translate3d(0,0,0);
  }
  #avatar-image {
    max-width: 88vw;
    max-height: 62vh;
    object-fit: contain;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .overlay.open { display: flex; }

  .sheet {
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    max-height: 88dvh;
    background: #1f2937;
    color: #fff;
    border-bottom-left-radius: 22px;
    border-bottom-right-radius: 22px;
    padding: 14px 18px 26px;
    padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    animation: slideDown 0.22s ease-out;
  }
  @keyframes slideDown {
    from { transform: translateY(-30px); opacity: 0.5; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    position: sticky;
    top: -14px;
    background: #1f2937;
    padding: 8px 0;
    z-index: 1;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sheet-header h2 { font-size: 16px; margin: 0; font-weight: 700; }
  .close-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.6;
    margin: 16px 0 8px;
    font-weight: 700;
  }

  .control { margin-bottom: 12px; }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 3px;
    opacity: 0.95;
  }
  .control input[type="range"] {
    width: 100%;
    height: 26px;
    -webkit-appearance: none;
    background: transparent;
  }
  .control input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
  }
  .control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #fff;
    margin-top: -9px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-row input[type="color"] {
    width: 48px; height: 34px;
    border: none; border-radius: 8px;
    background: transparent;
    cursor: pointer;
  }

  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .action-btn {
    flex: 1;
    min-width: 130px;
    padding: 12px;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: #4ade80;
    color: #0f172a;
    cursor: pointer;
  }
  .action-btn.rec { background: #f87171; color: #fff; }
  .action-btn.danger { background: #dc2626; color: #fff; }
  .action-btn.secondary {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
  }

  .permission-box {
    background: rgba(255,80,80,0.2);
    border: 1px solid rgba(255,120,120,0.6);
    border-radius: 12px;
    padding: 12px;
    margin-top: 10px;
    font-size: 12.5px;
    line-height: 1.45;
    display: none;
  }
  .permission-box.visible { display: block; }
  .permission-box strong { display: block; margin-bottom: 6px; font-size: 13px; }
  .permission-box button {
    background: #fff; color: #0f172a; border: none;
    border-radius: 8px; padding: 8px 12px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; margin-right: 6px; margin-top: 8px;
  }

  #mic-bar {
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  #mic-level {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4ade80, #facc15, #f87171);
    transition: width 0.05s;
  }

  #hint {
    position: absolute;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.78);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    text-align: center;
    max-width: 90vw;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 100;
  }
  #hint.show { opacity: 1; }

  #poses-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .pose-btn {
    aspect-ratio: 1;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 4px;
    transition: all 0.15s;
    position: relative;
  }
  .pose-btn:active { transform: scale(0.95); }
  .pose-btn.active {
    background: #4ade80;
    color: #0f172a;
    border-color: #fff;
  }
  .pose-btn.loaded { border-color: #4ade80; }
  .pose-btn.active.loaded { border-color: #fff; background: #4ade80; }
  .pose-btn .emoji { font-size: 24px; line-height: 1; }
  .pose-btn .name { font-size: 9px; opacity: 0.85; text-align: center; }
  .pose-btn.loaded::after {
    content: '';
    position: absolute;
    top: 4px; right: 4px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
  }
  .pose-btn.active.loaded::after { background: #0f172a; }

  #avatar-selector {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .avatar-opt {
    flex: 1;
    min-width: 60px;
    padding: 10px 6px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .avatar-opt.active {
    background: #fff;
    color: #00b140;
    border-color: #fff;
  }

  .file-info {
    font-size: 11.5px;
    opacity: 0.8;
    margin-top: 6px;
    line-height: 1.5;
    word-break: break-all;
  }
  .file-info.empty { opacity: 0.5; font-style: italic; }
</style>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <div id="main-row">
      <button class="main-btn" id="btn-poses">🎭 Poses</button>
      <button class="main-btn" id="btn-sync">📄 Sincronizar</button>
      <button id="btn-settings" class="main-btn" title="Ajustes">⚙️</button>
    </div>

    <div id="audio-row">
      <button class="audio-btn" id="btn-audio-load" title="Cargar audio">🎵</button>
      <button class="audio-btn" id="btn-audio-play" disabled title="Play">▶</button>
      <button class="audio-btn" id="btn-audio-pause" disabled title="Pausa">⏸</button>
      <button class="audio-btn" id="btn-audio-stop" disabled title="Stop">⏹</button>
      <button class="audio-btn" id="btn-vibe-toggle" title="Vibración">🔵</button>
      <button class="audio-btn" id="btn-sync-clear" title="Quitar sincronización" style="display:none">✕</button>
    </div>

    <div id="audio-progress-row" class="disabled">
      <span id="audio-cur">0:00</span>
      <div id="audio-progress"><div id="audio-progress-fill"></div></div>
      <span id="audio-dur">0:00</span>
    </div>

    <div id="status-row">
      <span id="status-pose">Pose: normal</span>
      <span id="status-sync" class="sync-badge" style="display:none">AUTO</span>
    </div>
  </div>

  <div id="stage">
    <div id="avatar-wrapper">
      <img id="avatar-image" alt="avatar" src="" />
    </div>
    <div id="hint"></div>
  </div>
</div>

<!-- MODAL: POSES -->
<div id="poses-overlay" class="overlay">
  <div class="sheet">
    <div class="sheet-header">
      <h2>🎭 Poses</h2>
      <button class="close-btn" id="btn-close-poses">✕ Cerrar</button>
    </div>
    <div id="poses-grid"></div>
  </div>
</div>

<!-- MODAL: AJUSTES -->
<div id="settings-overlay" class="overlay">
  <div class="sheet">
    <div class="sheet-header">
      <h2>⚙️ Ajustes</h2>
      <button class="close-btn" id="btn-close-settings">✕ Cerrar</button>
    </div>

    <div class="section-title">Avatar</div>
    <div class="avatar-selector" id="avatar-selector">
      <button class="avatar-opt active" data-avatar="1">Avatar 1</button>
      <button class="avatar-opt" data-avatar="2">Avatar 2</button>
      <button class="avatar-opt" data-avatar="3">Avatar 3</button>
      <button class="avatar-opt" data-avatar="4">Avatar 4</button>
      <button class="avatar-opt" data-avatar="5">Avatar 5</button>
    </div>

    <div class="section-title">Micrófono</div>
    <div class="control">
      <label>Nivel de entrada</label>
      <div id="mic-bar"><div id="mic-level"></div></div>
    </div>
    <div class="control">
      <label>Sensibilidad <span id="val-sens">50</span></label>
      <input type="range" id="sens" min="1" max="100" value="50">
    </div>
    <div class="control">
      <label>Retraso al cerrar boca <span id="val-hold">120 ms</span></label>
      <input type="range" id="hold" min="0" max="1500" value="120" step="10">
    </div>
    <div class="action-row">
      <button class="action-btn" id="btn-mic">🎤 Activar micrófono</button>
    </div>

    <div class="permission-box" id="perm-box">
      <strong id="perm-title">⚠️ Permiso denegado</strong>
      <div id="perm-body"></div>
      <button id="perm-retry">🔄 Reintentar</button>
      <button id="perm-reload">↻ Recargar</button>
    </div>

    <div class="section-title">Animación</div>
    <div class="control">
      <label>Velocidad de parpadeo <span id="val-blink">3500 ms</span></label>
      <input type="range" id="blink" min="500" max="8000" value="3500" step="100">
    </div>
    <div class="control">
      <label>Oscilación vertical <span id="val-oscv">2 px</span></label>
      <input type="range" id="oscv" min="0" max="20" value="2" step="0.5">
    </div>
    <div class="control">
      <label>Oscilación horizontal <span id="val-oscx">0 px</span></label>
      <input type="range" id="oscx" min="0" max="20" value="0" step="0.5">
    </div>
    <div class="control">
      <label>Vibración normal <span id="val-vib">0.3 px</span></label>
      <input type="range" id="vib" min="0" max="3" value="0.3" step="0.1">
    </div>
    <div class="control">
      <label>Multiplicador boost 🫨 <span id="val-vibboost">1.5x</span></label>
      <input type="range" id="vibboost" min="1" max="3" value="1.5" step="0.1">
    </div>
    <div class="control">
      <label>Velocidad de oscilación <span id="val-osct">1.0x</span></label>
      <input type="range" id="osct" min="0.1" max="3" value="1" step="0.1">
    </div>

    <div class="section-title">Color de fondo</div>
    <div class="control">
      <div class="color-row">
        <input type="color" id="bgcolor" value="#00b140">
        <span style="font-size:12px;opacity:.8">Verde croma por defecto</span>
      </div>
    </div>

    <div class="section-title">Audio</div>
    <div class="file-info empty" id="audio-info">Sin audio cargado</div>
    <div class="action-row">
      <button class="action-btn secondary" id="btn-audio-load2">🎵 Cargar audio</button>
      <button class="action-btn danger" id="btn-audio-clear">🗑️ Quitar audio</button>
    </div>

    <div class="section-title">Sincronización</div>
    <div class="file-info empty" id="sync-info">Sin archivo de sincronización</div>
    <div class="action-row">
      <button class="action-btn secondary" id="btn-sync-load2">📄 Cargar archivo</button>
      <button class="action-btn danger" id="btn-sync-clear2">🗑️ Quitar archivo</button>
    </div>

    <div class="section-title">Poses</div>
    <div class="file-info" id="poses-info">—</div>
    <div class="action-row">
      <button class="action-btn secondary" id="btn-reload-poses">🔄 Recargar poses</button>
    </div>

    <div class="section-title">Almacenamiento</div>
    <div class="action-row">
      <button class="action-btn danger" id="btn-wipe">🗑️ Borrar TODO</button>
    </div>
  </div>
</div>

<input type="file" id="audio-input" accept="audio/*" style="display:none">
<input type="file" id="sync-input" accept=".txt,.srt,text/plain" style="display:none">

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const STORAGE_KEY = 'vtuber_multi_v3';
const ASSETS_PATH = 'assets/';
const IDB_NAME = 'vtuber_db';
const IDB_STORE = 'files';
const IDB_AUDIO_KEY = 'last_audio';
const IDB_SYNC_KEY = 'last_sync';

/* 18 poses — IDs internos en ASCII limpio (sin tildes ni emojis)
   El emoji se usa SOLO para UI. El nombre de archivo usa el `id`.
   Nomenclatura PNG: assets/{avatar}_{id}_{variant}.png  ej: 1_normal_AA.png */
const POSES = [
  { id: 'normal',         emoji: '😀',       label: 'Normal' },
  { id: 'serio',          emoji: '😠',       label: 'Serio' },
  { id: 'interesante',    emoji: '😉',       label: 'Interesante' },
  { id: 'esceptico',      emoji: '🤔',       label: 'Escéptico' },
  { id: 'analitico',      emoji: '🧐',       label: 'Analítico' },
  { id: 'advertencia',    emoji: '⚠️',       label: 'Advertencia' },
  { id: 'sorprendido',    emoji: '😲',       label: 'Sorprendido' },
  { id: 'celebracion',    emoji: '🏆',       label: 'Celebración' },
  { id: 'incertidumbre',  emoji: '🤷🏻‍♂️',   label: 'Incertidumbre' },
  { id: 'senalar',        emoji: '🫵🏻',      label: 'Señalar' },
  { id: 'pc',             emoji: '🖥',       label: 'PC' },
  { id: 'celular',        emoji: '📲',       label: 'Celular' },
  { id: 'explicando',     emoji: '👨🏻‍🏫',   label: 'Explicando' },
  { id: 'aprobacion',     emoji: '👍',       label: 'Aprobación' },
  { id: 'desaprobacion',  emoji: '👎',       label: 'Desaprobación' },
  { id: 'decepcion',      emoji: '🤦🏻‍♂️',   label: 'Decepción' },
  { id: 'idea',           emoji: '💡',       label: 'Idea' },
  { id: 'triste',         emoji: '😒',       label: 'Triste' }
];
const POSE_MAP = Object.fromEntries(POSES.map(p => [p.id, p]));
const VARIANTS = ['AA', 'AB', 'BA', 'BB'];

/* ============================================================
   ESTADO
   ============================================================ */
const STATE = {
  avatar: 1,
  poseId: 'normal',
  eyesOpen: true,
  mouthOpen: false,
  sensitivity: 50,
  mouthHold: 120,
  blinkInterval: 3500,
  oscVertical: 2,
  oscHorizontal: 0,
  vibration: 0.3,
  vibBoostMultiplier: 1.5,
  vibBoostActive: false,
  oscSpeed: 1.0,
  bgColor: '#00b140',
  settingsOpen: false,
  posesOpen: false,
  imageCache: {},
  imageStatus: {},
  /* syncEntries: [{ time, poseId, boost:boolean, text:string }] */
  syncEntries: [],
  syncActive: false,
  syncFileName: '',
  currentSyncIndex: -1
};

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const avatarImg   = $('avatar-image');
const avatarWrap  = $('avatar-wrapper');
const appEl       = $('app');
const micLevel    = $('mic-level');
const hintEl      = $('hint');
const posesGrid   = $('poses-grid');
const posesInfo   = $('poses-info');
const statusPose  = $('status-pose');
const statusSync  = $('status-sync');
const syncInfo    = $('sync-info');
const audioInfo   = $('audio-info');
const overlayPoses = $('poses-overlay');
const overlaySettings = $('settings-overlay');
const btnPoses    = $('btn-poses');
const btnSync     = $('btn-sync');
const btnSyncClear = $('btn-sync-clear');
const btnVibeToggle = $('btn-vibe-toggle');
const btnMic      = $('btn-mic');
const permBox     = $('perm-box');
const permTitle   = $('perm-title');
const permBody    = $('perm-body');

/* ============================================================
   INDEXEDDB
   ============================================================ */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
async function idbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
async function idbDelete(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

/* ============================================================
   IMÁGENES LAZY
   ============================================================ */
function imageKey(avatar, poseId, variant) {
  return `${avatar}_${poseId}_${variant}`;
}
function imageUrl(avatar, poseId, variant) {
  return `${ASSETS_PATH}${avatar}_${poseId}_${variant}.png`;
}

function getImage(avatar, poseId, variant, onReady) {
  const key = imageKey(avatar, poseId, variant);
  if (STATE.imageCache[key]) return STATE.imageCache[key];
  if (STATE.imageStatus[key] === 'missing') return null;

  const img = new Image();
  img.onload = () => {
    STATE.imageStatus[key] = 'loaded';
    STATE.imageCache[key] = img;
    if (onReady) onReady(img, true);
  };
  img.onerror = () => {
    STATE.imageStatus[key] = 'missing';
    if (onReady) onReady(null, false);
  };
  img.src = imageUrl(avatar, poseId, variant);
  return null;
}

function preloadPose(avatar, poseId) {
  VARIANTS.forEach(v => {
    const key = imageKey(avatar, poseId, v);
    if (STATE.imageCache[key] || STATE.imageStatus[key] === 'missing') return;
    getImage(avatar, poseId, v);
  });
}

async function preloadAllPoses(avatar) {
  for (const pose of POSES) {
    for (const v of VARIANTS) {
      const key = imageKey(avatar, pose.id, v);
      if (STATE.imageCache[key] || STATE.imageStatus[key] === 'missing') continue;
      getImage(avatar, pose.id, v);
      await new Promise(r => setTimeout(r, 15));
    }
  }
}

/* ============================================================
   RENDER DEL AVATAR
   ============================================================ */
function currentVariant() {
  return (STATE.eyesOpen ? 'A' : 'B') + (STATE.mouthOpen ? 'A' : 'B');
}

function actualizarAvatar() {
  const variant = currentVariant();
  const key = imageKey(STATE.avatar, STATE.poseId, variant);
  const cached = STATE.imageCache[key];

  if (cached) {
    avatarImg.src = cached.src;
    return;
  }

  if (STATE.imageStatus[key] !== 'missing') {
    getImage(STATE.avatar, STATE.poseId, variant, (img, ok) => {
      if (ok) {
        if (currentVariant() === variant &&
            imageKey(STATE.avatar, STATE.poseId, variant) === key) {
          avatarImg.src = img.src;
        }
      }
    });
  }

  if (STATE.poseId !== 'normal') {
    const normalKey = imageKey(STATE.avatar, 'normal', variant);
    if (STATE.imageCache[normalKey]) {
      avatarImg.src = STATE.imageCache[normalKey].src;
      return;
    }
  }

  const pose = POSE_MAP[STATE.poseId] || { label: STATE.poseId, emoji: '?' };
  avatarImg.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
      <rect width="100%" height="100%" fill="#0f5132"/>
      <text x="50%" y="45%" fill="#a7f3d0" font-size="22"
            text-anchor="middle" font-family="sans-serif">
        ${pose.emoji} ${pose.label}
      </text>
      <text x="50%" y="55%" fill="#6ee7b7" font-size="16"
            text-anchor="middle" font-family="sans-serif">
        ${variant} — sin imagen
      </text>
    </svg>`);
}

/* ============================================================
   SINCRONIZACIÓN — parser
   ============================================================
   Formato por línea:
       HH:MM:SS  <poseId>  [N|V]  ["texto libre opcional"]
   - HH:MM:SS o MM:SS
   - poseId debe existir en POSE_MAP
   - N = normal (por defecto si falta), V = boost vibración
   - texto entre comillas dobles: se guarda en entry.text, NO se usa para UI
   - líneas vacías o con # se ignoran
   ============================================================ */
function parseTime(str) {
  const parts = str.split(':').map(s => parseFloat(s));
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  return NaN;
}

/* Extrae el bloque entre la primera y última comilla doble.
   Devuelve '' si no hay comillas. */
function extractQuoted(line) {
  const first = line.indexOf('"');
  if (first === -1) return '';
  const last = line.lastIndexOf('"');
  if (last <= first) return '';
  return line.slice(first + 1, last).trim();
}

function parseSyncFile(text) {
  const entries = [];
  const lines = text.split(/\r?\n/);
  for (const raw of lines) {
    const original = raw;
    let line = raw.trim();
    if (!line || line.startsWith('#')) continue;

    // 1) Extraer texto entre comillas primero (puede contener espacios)
    const quotedText = extractQuoted(line);
    // Quitar el bloque de comillas de la línea para parsear el resto
    if (quotedText) {
      const first = line.indexOf('"');
      const last = line.lastIndexOf('"');
      line = (line.slice(0, first) + line.slice(last + 1)).trim();
    }

    // 2) Tokenizar por espacios
    const parts = line.split(/\s+/);
    if (parts.length < 2) continue;

    const t = parseTime(parts[0]);
    if (!isFinite(t)) continue;

    const poseId = parts[1].toLowerCase();
    if (!POSE_MAP[poseId]) {
      console.warn(`Pose desconocida: "${poseId}" en línea: "${original.trim()}"`);
      continue;
    }

    // 3) Boost: N (normal) o V (boost). Por defecto N.
    let boost = false;
    if (parts[2]) {
      const flag = parts[2].toUpperCase();
      if (flag === 'V') boost = true;
      else if (flag === 'N') boost = false;
      else {
        console.warn(`Flag de vibración desconocido: "${parts[2]}" en línea: "${original.trim()}" (asumo N)`);
      }
    }

    entries.push({ time: t, poseId, boost, text: quotedText });
  }

  entries.sort((a, b) => a.time - b.time);
  const dedup = [];
  for (const e of entries) {
    if (dedup.length && dedup[dedup.length-1].time === e.time) {
      dedup[dedup.length-1] = e;
    } else {
      dedup.push(e);
    }
  }
  return dedup;
}

/* ============================================================
   AUDIO
   ============================================================ */
let audioEl = null;
let audioCtxFile = null;
let audioSourceNode = null;
let audioAnalyser = null;
let audioDataArray = null;
let audioLoaded = false;
let audioPlaying = false;
let audioRafId = null;
let audioObjectUrl = null;
let audioFileName = '';
let audioFileBlob = null;
let lastSavedPosition = 0;
let positionSaveTimer = null;

const btnAudioLoad  = $('btn-audio-load');
const btnAudioPlay  = $('btn-audio-play');
const btnAudioPause = $('btn-audio-pause');
const btnAudioStop  = $('btn-audio-stop');
const audioInput    = $('audio-input');
const syncInput     = $('sync-input');
const audioProgressRow = $('audio-progress-row');
const audioProgress = $('audio-progress');
const audioProgressFill = $('audio-progress-fill');
const audioCur = $('audio-cur');
const audioDur = $('audio-dur');

function fmtSec(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60);
  return `${m}:${String(r).padStart(2, '0')}`;
}

function updateAudioUI() {
  btnAudioPlay.disabled  = !audioLoaded || audioPlaying;
  btnAudioPause.disabled = !audioLoaded || !audioPlaying;
  btnAudioStop.disabled  = !audioLoaded;
  btnAudioLoad.classList.toggle('active-blue', audioLoaded);
  audioProgressRow.classList.toggle('disabled', !audioLoaded);

  if (!audioLoaded) {
    audioInfo.textContent = 'Sin audio cargado';
    audioInfo.classList.add('empty');
    audioProgressFill.style.width = '0%';
    audioCur.textContent = '0:00';
    audioDur.textContent = '0:00';
  } else {
    const dur = isFinite(audioEl.duration) ? audioEl.duration : 0;
    const estado = audioPlaying ? '▶ sonando' : '⏸ detenido';
    audioInfo.textContent = `🎵 ${audioFileName || 'audio'} · ${dur.toFixed(1)}s · ${estado}`;
    audioInfo.classList.remove('empty');
    audioDur.textContent = fmtSec(dur);
    updateProgressBar();
  }
}

function updateProgressBar() {
  if (!audioLoaded || !audioEl) {
    audioProgressFill.style.width = '0%';
    audioCur.textContent = '0:00';
    return;
  }
  const dur = isFinite(audioEl.duration) && audioEl.duration > 0 ? audioEl.duration : 0;
  const cur = audioEl.currentTime || 0;
  const pct = dur > 0 ? Math.min(100, (cur / dur) * 100) : 0;
  audioProgressFill.style.width = pct + '%';
  audioCur.textContent = fmtSec(cur);
}

function scheduleSavePosition() {
  if (!audioLoaded || !audioEl) return;
  clearTimeout(positionSaveTimer);
  positionSaveTimer = setTimeout(() => {
    lastSavedPosition = audioEl.currentTime || 0;
    saveAudioMeta();
  }, 1500);
}
async function saveAudioMeta() {
  if (!audioFileBlob) return;
  try {
    await idbPut(IDB_AUDIO_KEY, {
      name: audioFileName, blob: audioFileBlob,
      position: lastSavedPosition || 0, savedAt: Date.now()
    });
  } catch (e) { console.warn(e); }
}

async function loadAudioFile(file, opts = {}) {
  const { persist = true, startAt = 0, silent = false } = opts;
  clearAudio(true);
  audioFileBlob = file;
  audioFileName = file.name || 'audio';
  audioObjectUrl = URL.createObjectURL(file);

  audioEl = new Audio();
  audioEl.src = audioObjectUrl;
  audioEl.crossOrigin = 'anonymous';
  audioEl.preload = 'auto';

  audioEl.addEventListener('loadedmetadata', () => {
    if (startAt > 0 && isFinite(audioEl.duration) && startAt < audioEl.duration) {
      try { audioEl.currentTime = startAt; } catch(e){}
    }
    updateAudioUI();
    applySyncAtTime(audioEl.currentTime);
  });
  audioEl.addEventListener('timeupdate', () => {
    updateProgressBar();
    scheduleSavePosition();
    applySyncAtTime(audioEl.currentTime);
  });
  audioEl.addEventListener('play', () => {
    audioPlaying = true;
    updateAudioUI();
    if (!audioRafId) analizarAudio();
  });
  audioEl.addEventListener('pause', () => {
    audioPlaying = false;
    if (audioRafId) { cancelAnimationFrame(audioRafId); audioRafId = null; }
    setMouth(false);
    updateAudioUI();
  });
  audioEl.addEventListener('ended', () => {
    audioPlaying = false;
    lastSavedPosition = 0;
    saveAudioMeta();
    if (audioRafId) { cancelAnimationFrame(audioRafId); audioRafId = null; }
    setMouth(false);
    updateAudioUI();
  });

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  audioCtxFile = new AudioCtx();
  audioSourceNode = audioCtxFile.createMediaElementSource(audioEl);
  audioAnalyser = audioCtxFile.createAnalyser();
  audioAnalyser.fftSize = 512;
  audioAnalyser.smoothingTimeConstant = 0.6;
  audioSourceNode.connect(audioAnalyser);
  audioAnalyser.connect(audioCtxFile.destination);
  audioDataArray = new Uint8Array(audioAnalyser.fftSize);

  audioLoaded = true;
  audioPlaying = false;
  updateAudioUI();

  if (persist) {
    try {
      await idbPut(IDB_AUDIO_KEY, {
        name: audioFileName, blob: file,
        position: startAt || 0, savedAt: Date.now()
      });
    } catch (e) { console.warn(e); showHint('⚠️ No se pudo guardar el audio'); }
  }
  if (!silent) showHint(`🎵 Audio cargado: ${audioFileName}`);
}

async function restoreSavedAudio() {
  try {
    const saved = await idbGet(IDB_AUDIO_KEY);
    if (!saved || !saved.blob) return false;
    const file = new File([saved.blob], saved.name || 'audio', { type: saved.blob.type || 'audio/mpeg' });
    await loadAudioFile(file, { persist: false, startAt: saved.position || 0, silent: true });
    showHint(`🎵 Audio restaurado: ${saved.name || 'audio'}`);
    return true;
  } catch (e) { console.warn(e); return false; }
}

function playAudio() {
  if (!audioLoaded || !audioEl) return;
  audioCtxFile.resume().catch(()=>{});
  audioEl.play().then(() => {
    audioPlaying = true;
    updateAudioUI();
    if (!audioRafId) analizarAudio();
  }).catch(err => { console.error(err); showHint('No se pudo reproducir'); });
}
function pauseAudio() {
  if (!audioLoaded || !audioEl) return;
  audioEl.pause();
  audioPlaying = false;
  lastSavedPosition = audioEl.currentTime || 0;
  saveAudioMeta();
  if (audioRafId) { cancelAnimationFrame(audioRafId); audioRafId = null; }
  setMouth(false);
  updateAudioUI();
}
function stopAudio() {
  if (!audioLoaded || !audioEl) return;
  audioEl.pause();
  audioEl.currentTime = 0;
  audioPlaying = false;
  lastSavedPosition = 0;
  saveAudioMeta();
  if (audioRafId) { cancelAnimationFrame(audioRafId); audioRafId = null; }
  setMouth(false);
  updateAudioUI();
  applySyncAtTime(0);
}
function clearAudio(silent) {
  if (audioRafId) { cancelAnimationFrame(audioRafId); audioRafId = null; }
  if (audioEl) { try { audioEl.pause(); } catch(e){} audioEl.src = ''; audioEl = null; }
  if (audioSourceNode) { try { audioSourceNode.disconnect(); } catch(e){} audioSourceNode = null; }
  if (audioAnalyser) { try { audioAnalyser.disconnect(); } catch(e){} audioAnalyser = null; }
  if (audioCtxFile) { try { audioCtxFile.close(); } catch(e){} audioCtxFile = null; }
  if (audioObjectUrl) { URL.revokeObjectURL(audioObjectUrl); audioObjectUrl = null; }
  audioLoaded = false; audioPlaying = false;
  audioDataArray = null; audioFileName = ''; audioFileBlob = null;
  lastSavedPosition = 0;
  setMouth(false);
  updateAudioUI();
  if (!silent) showHint('Audio quitado');
}

function analizarAudio() {
  if (!audioAnalyser || !audioDataArray) return;
  audioAnalyser.getByteTimeDomainData(audioDataArray);
  let sum = 0;
  for (let i = 0; i < audioDataArray.length; i++) {
    const v = (audioDataArray[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / audioDataArray.length);
  micLevel.style.width = Math.min(100, rms * 250) + '%';
  const threshold = 0.35 - (STATE.sensitivity / 100) * 0.33;
  setMouth(rms > threshold);

  if (audioPlaying && audioEl && !audioEl.paused) {
    audioRafId = requestAnimationFrame(analizarAudio);
  } else {
    audioRafId = null;
  }
}

function seekFromEvent(clientX) {
  if (!audioLoaded || !audioEl) return;
  const rect = audioProgress.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const dur = isFinite(audioEl.duration) ? audioEl.duration : 0;
  if (dur > 0) {
    audioEl.currentTime = pct * dur;
    lastSavedPosition = audioEl.currentTime;
    saveAudioMeta();
    updateProgressBar();
    applySyncAtTime(audioEl.currentTime);
  }
}
audioProgress.addEventListener('click', e => seekFromEvent(e.clientX));
audioProgress.addEventListener('touchstart', e => {
  if (e.touches[0]) seekFromEvent(e.touches[0].clientX);
}, { passive: true });

btnAudioLoad.addEventListener('click', () => audioInput.click());
$('btn-audio-load2').addEventListener('click', () => audioInput.click());
audioInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  loadAudioFile(file, { persist: true, startAt: 0 });
  e.target.value = '';
});

btnAudioPause.addEventListener('click', pauseAudio);

  try { await idbDelete(IDB_AUDIO_KEY); } catch(e) { console.warn(e); }
});

/* ============================================================
   MODO AUTOMÁTICO (SINCRONIZACIÓN)
   ============================================================ */
function applySyncAtTime(t) {
  if (!STATE.syncActive || !STATE.syncEntries.length) return;
  let idx = -1;
  for (let i = 0; i < STATE.syncEntries.length; i++) {
    if (STATE.syncEntries[i].time <= t + 0.001) idx = i;
    else break;
  }
  if (idx === -1) idx = 0;
  if (idx !== STATE.currentSyncIndex) {
    STATE.currentSyncIndex = idx;
    const e = STATE.syncEntries[idx];
    setPose(e.poseId, false);
    STATE.vibBoostActive = e.boost;
    updateVibeToggleUI();
    updateStatusRow();
  }
}

function activateSync(entries, fileName) {
  STATE.syncEntries = entries;
  STATE.syncFileName = fileName || 'sincronización';
  STATE.syncActive = true;
  STATE.currentSyncIndex = -1;
  if (audioLoaded && audioEl) {
    applySyncAtTime(audioEl.currentTime);
  } else if (entries.length) {
    setPose(entries[0].poseId, false);
    STATE.vibBoostActive = entries[0].boost;
    updateVibeToggleUI();
  }
  updateSyncUI();
  updateStatusRow();
  closePoses();
}

function deactivateSync() {
  STATE.syncActive = false;
  STATE.currentSyncIndex = -1;
  updateSyncUI();
  updateStatusRow();
}

function clearSync() {
  STATE.syncEntries = [];
  STATE.syncFileName = '';
  deactivateSync();
}

function updateSyncUI() {
  if (STATE.syncActive) {
    syncInfo.textContent = `📄 ${STATE.syncFileName} · ${STATE.syncEntries.length} entradas`;
    syncInfo.classList.remove('empty');
    btnSync.classList.add('active-green');
    btnSyncClear.style.display = '';
    btnPoses.disabled = true;
    btnPoses.style.opacity = 0.35;
  } else {
    syncInfo.textContent = STATE.syncEntries.length
      ? `📄 ${STATE.syncFileName} (${STATE.syncEntries.length} entradas, inactivo)`
      : 'Sin archivo de sincronización';
    syncInfo.classList.toggle('empty', !STATE.syncEntries.length);
    btnSync.classList.remove('active-green');
    btnSyncClear.style.display = 'none';
    btnPoses.disabled = false;
    btnPoses.style.opacity = 1;
  }
}

function setSyncFile(file, opts = {}) {
  const { persist = true, silent = false } = opts;
  const reader = new FileReader();
  reader.onload = async e => {
    const text = e.target.result;
    const entries = parseSyncFile(text);
    if (!entries.length) {
      showHint('⚠️ El archivo no tiene entradas válidas');
      return;
    }
    activateSync(entries, file.name);
    if (persist) {
      try {
        await idbPut(IDB_SYNC_KEY, {
          name: file.name, text, savedAt: Date.now()
        });
      } catch (err) { console.warn(err); }
    }
    if (!silent) showHint(`📄 ${file.name}: ${entries.length} entradas`);
  };
  reader.readAsText(file);
}

async function restoreSavedSync() {
  try {
    const saved = await idbGet(IDB_SYNC_KEY);
    if (!saved || !saved.text) return false;
    const entries = parseSyncFile(saved.text);
    if (!entries.length) return false;
    activateSync(entries, saved.name);
    showHint(`📄 Sincronización restaurada: ${saved.name}`);
    return true;
  } catch (e) { console.warn(e); return false; }
}

/* ============================================================
   VIBRACIÓN BOOST (toggle)
   ============================================================ */
function updateVibeToggleUI() {
  if (STATE.vibBoostActive) {
    btnVibeToggle.textContent = '🫨';
    btnVibeToggle.classList.add('active-red');
    btnVibeToggle.classList.remove('active-blue');
  } else {
    btnVibeToggle.textContent = '🔵';
    btnVibeToggle.classList.remove('active-red');
    btnVibeToggle.classList.add('active-blue');
  }
}
btnVibeToggle.addEventListener('click', () => {
  STATE.vibBoostActive = !STATE.vibBoostActive;
  updateVibeToggleUI();
  updateStatusRow();
});
updateVibeToggleUI();

/* ============================================================
   BOCA (lip-sync)
   ============================================================ */
let mouthCloseTimer = null;
function setMouth(open) {
  if (open) {
    if (mouthCloseTimer) { clearTimeout(mouthCloseTimer); mouthCloseTimer = null; }
    if (!STATE.mouthOpen) {
      STATE.mouthOpen = true;
      actualizarAvatar();
    }
  } else {
    if (mouthCloseTimer) return;
    if (!STATE.mouthOpen) return;
    mouthCloseTimer = setTimeout(() => {
      mouthCloseTimer = null;
      STATE.mouthOpen = false;
      actualizarAvatar();
    }, STATE.mouthHold);
  }
}

/* ============================================================
   MICRÓFONO
   ============================================================ */
let audioCtx = null, analyser = null, dataArray = null, micStream = null, micActive = false;

async function checkPermission() {
  if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
  try {
    const status = await navigator.permissions.query({ name: 'microphone' });
    return status.state;
  } catch { return 'unknown'; }
}
function showPermissionHelp(title, bodyHtml) {
  permTitle.textContent = title;
  permBody.innerHTML = bodyHtml;
  permBox.classList.add('visible');
}
function hidePermissionHelp() { permBox.classList.remove('visible'); }

async function activarMicrofono() {
  hidePermissionHelp();
  const permState = await checkPermission();
  if (permState === 'denied') {
    showPermissionHelp('🚫 Permiso bloqueado previamente',
      `Toca el <b>candado 🔒</b> o <b>ⓘ</b> junto a la URL → <b>Permisos</b> → <b>Micrófono</b> → <b>Permitir</b>.<br>Luego recarga.`);
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.fftSize);
    micActive = true;
    btnMic.textContent = '🔴 Micrófono activo (toca para detener)';
    btnMic.classList.add('rec');
    showHint('Micrófono activo');
    medirAudio();
  } catch (err) {
    console.error(err);
    let msg = 'Error: ' + err.message;
    if (err.name === 'NotAllowedError') msg = 'Permiso rechazado. Toca el candado 🔒 y cámbialo a <b>Permitir</b>. Verifica HTTPS.';
    else if (err.name === 'NotFoundError') msg = 'No se encontró micrófono.';
    else if (err.name === 'NotReadableError') msg = 'El micrófono está en uso por otra app.';
    showPermissionHelp('⚠️ No se pudo activar', msg);
  }
}
function medirAudio() {
  if (!micActive) return;
  if (audioLoaded && audioPlaying) {
    requestAnimationFrame(medirAudio);
    return;
  }
  analyser.getByteTimeDomainData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = (dataArray[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / dataArray.length);
  micLevel.style.width = Math.min(100, rms * 250) + '%';
  const threshold = 0.35 - (STATE.sensitivity / 100) * 0.33;
  setMouth(rms > threshold);
  requestAnimationFrame(medirAudio);
}
$('perm-retry').addEventListener('click', () => { hidePermissionHelp(); activarMicrofono(); });
$('perm-reload').addEventListener('click', () => location.reload());
btnMic.addEventListener('click', () => {
  if (!micActive) activarMicrofono();
  else {
    micActive = false;
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    btnMic.textContent = '🎤 Activar micrófono';
    btnMic.classList.remove('rec');
    setMouth(false);
    hidePermissionHelp();
  }
});

/* ============================================================
   PARPADEO
   ============================================================ */
let blinkTimer = null;
function scheduleBlink() {
  clearTimeout(blinkTimer);
  if (STATE.settingsOpen || STATE.posesOpen) return;
  const base = STATE.blinkInterval;
  const jitter = base * (0.6 + Math.random() * 0.8);
  blinkTimer = setTimeout(() => {
    if (STATE.settingsOpen || STATE.posesOpen) return;
    STATE.eyesOpen = false;
    actualizarAvatar();
    setTimeout(() => {
      STATE.eyesOpen = true;
      actualizarAvatar();
      scheduleBlink();
    }, 140);
  }, jitter);
}

/* ============================================================
   MOVIMIENTO
   ============================================================ */
let phase = 0;
let vibTargetX = 0, vibTargetY = 0;
let vibCurrentX = 0, vibCurrentY = 0;
let lastVibUpdate = 0;
let frozenTransform = 'translate3d(0,0,0)';

function motionLoop(now) {
  now = now || performance.now();
  if (STATE.settingsOpen || STATE.posesOpen) {
    avatarWrap.style.transform = frozenTransform;
    requestAnimationFrame(motionLoop);
    return;
  }
  phase += 0.04 * STATE.oscSpeed;
  const yOsc = Math.sin(phase) * STATE.oscVertical;
  const xOsc = Math.cos(phase * 0.8) * STATE.oscHorizontal;

  if (now - lastVibUpdate > 80) {
    lastVibUpdate = now;
    const mult = STATE.vibBoostActive ? STATE.vibBoostMultiplier : 1;
    const amp = STATE.vibration * mult * 0.5;
    vibTargetX = (Math.random() - 0.5) * 2 * amp;
    vibTargetY = (Math.random() - 0.5) * 2 * amp;
  }
  vibCurrentX += (vibTargetX - vibCurrentX) * 0.15;
  vibCurrentY += (vibTargetY - vibCurrentY) * 0.15;

  frozenTransform = `translate3d(${xOsc + vibCurrentX}px, ${yOsc + vibCurrentY}px, 0)`;
  avatarWrap.style.transform = frozenTransform;
  requestAnimationFrame(motionLoop);
}

/* ============================================================
   AJUSTES
   ============================================================ */
function openSettings() {
  STATE.settingsOpen = true;
  overlaySettings.classList.add('open');
}
function closeSettings() {
  STATE.settingsOpen = false;
  overlaySettings.classList.remove('open');
  scheduleBlink();
}
$('btn-settings').addEventListener('click', openSettings);
$('btn-close-settings').addEventListener('click', closeSettings);
overlaySettings.addEventListener('click', e => {
  if (e.target === overlaySettings) closeSettings();
});

document.querySelectorAll('.avatar-opt').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('.avatar-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    STATE.avatar = parseInt(btn.dataset.avatar, 10);
    STATE.imageCache = {};
    STATE.imageStatus = {};
    actualizarAvatar();
    refreshPosesGrid();
    updatePosesInfo();
    scheduleSave();
    preloadAllPoses(STATE.avatar).then(() => {
      refreshPosesGrid();
      updatePosesInfo();
      actualizarAvatar();
    });
  });
});

$('sens').addEventListener('input', e => {
  STATE.sensitivity = +e.target.value;
  $('val-sens').textContent = STATE.sensitivity;
  scheduleSave();
});
$('hold').addEventListener('input', e => {
  STATE.mouthHold = +e.target.value;
  $('val-hold').textContent = STATE.mouthHold + ' ms';
  scheduleSave();
});
$('blink').addEventListener('input', e => {
  STATE.blinkInterval = +e.target.value;
  $('val-blink').textContent = STATE.blinkInterval + ' ms';
  scheduleBlink(); scheduleSave();
});
$('oscv').addEventListener('input', e => {
  STATE.oscVertical = +e.target.value;
  $('val-oscv').textContent = STATE.oscVertical + ' px';
  scheduleSave();
});
$('oscx').addEventListener('input', e => {
  STATE.oscHorizontal = +e.target.value;
  $('val-oscx').textContent = STATE.oscHorizontal + ' px';
  scheduleSave();
});
$('vib').addEventListener('input', e => {
  STATE.vibration = +e.target.value;
  $('val-vib').textContent = STATE.vibration.toFixed(1) + ' px';
  scheduleSave();
});
$('vibboost').addEventListener('input', e => {
  STATE.vibBoostMultiplier = +e.target.value;
  $('val-vibboost').textContent = STATE.vibBoostMultiplier.toFixed(1) + 'x';
  scheduleSave();
});
$('osct').addEventListener('input', e => {
  STATE.oscSpeed = +e.target.value;
  $('val-osct').textContent = STATE.oscSpeed.toFixed(1) + 'x';
  scheduleSave();
});
$('bgcolor').addEventListener('input', e => {
  STATE.bgColor = e.target.value;
  document.documentElement.style.setProperty('--bg-color', STATE.bgColor);
  appEl.style.background = STATE.bgColor;
  scheduleSave();
});

$('btn-reload-poses').addEventListener('click', () => {
  STATE.imageCache = {};
  STATE.imageStatus = {};
  actualizarAvatar();
  refreshPosesGrid();
  updatePosesInfo();
  showHint('Recargando poses...');
  preloadAllPoses(STATE.avatar).then(() => {
    refreshPosesGrid();
    updatePosesInfo();
    actualizarAvatar();
    showHint('Poses recargadas');
  });
});

$('btn-wipe').addEventListener('click', async () => {
  if (!confirm('¿Borrar TODO? Esto quitará audio, sincronización y ajustes.')) return;
  localStorage.removeItem(STORAGE_KEY);
  try { await idbDelete(IDB_AUDIO_KEY); } catch(e){}
  try { await idbDelete(IDB_SYNC_KEY); } catch(e){}
  clearAudio(true);
  clearSync();
  STATE.avatar = 1;
  STATE.poseId = 'normal';
  STATE.imageCache = {};
  STATE.imageStatus = {};
  document.querySelectorAll('.avatar-opt').forEach(b => {
    b.classList.toggle('active', b.dataset.avatar === '1');
  });
  actualizarAvatar();
  refreshPosesGrid();
  updateStatusRow();
  showHint('Todo borrado');
});

/* ============================================================
   INFO DE POSES
   ============================================================ */
function updatePosesInfo() {
  let loaded = 0, missing = 0, unknown = 0;
  POSES.forEach(p => {
    VARIANTS.forEach(v => {
      const key = imageKey(STATE.avatar, p.id, v);
      if (STATE.imageStatus[key] === 'loaded') loaded++;
      else if (STATE.imageStatus[key] === 'missing') missing++;
      else unknown++;
    });
  });
  const total = POSES.length * VARIANTS.length;
  posesInfo.textContent = `Avatar ${STATE.avatar} · Cargadas: ${loaded}/${total} · Faltantes: ${missing} · Pendientes: ${unknown}`;
}

/* ============================================================
   HINT
   ============================================================ */
let hintTimer = null;
function showHint(text) {
  hintEl.textContent = text;
  hintEl.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.remove('show'), 3000);
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  const hadSave = loadState();

  document.documentElement.style.setProperty('--bg-color', STATE.bgColor);
  appEl.style.background = STATE.bgColor;
  $('bgcolor').value = STATE.bgColor;
  $('sens').value = STATE.sensitivity;      $('val-sens').textContent = STATE.sensitivity;
  $('hold').value = STATE.mouthHold;        $('val-hold').textContent = STATE.mouthHold + ' ms';
  $('blink').value = STATE.blinkInterval;   $('val-blink').textContent = STATE.blinkInterval + ' ms';
  $('oscv').value = STATE.oscVertical;      $('val-oscv').textContent = STATE.oscVertical + ' px';
  $('oscx').value = STATE.oscHorizontal;    $('val-oscx').textContent = STATE.oscHorizontal + ' px';
  $('vib').value = STATE.vibration;         $('val-vib').textContent = STATE.vibration.toFixed(1) + ' px';
  $('vibboost').value = STATE.vibBoostMultiplier; $('val-vibboost').textContent = STATE.vibBoostMultiplier.toFixed(1) + 'x';
  $('osct').value = STATE.oscSpeed;         $('val-osct').textContent = STATE.oscSpeed.toFixed(1) + 'x';

  document.querySelectorAll('.avatar-opt').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.avatar,10) === STATE.avatar);
  });

  buildPosesGrid();
  updateStatusRow();
  updateSyncUI();
  updatePosesInfo();
  updateAudioUI();
  updateVibeToggleUI();
  actualizarAvatar();
  scheduleBlink();
  requestAnimationFrame(motionLoop);

  preloadPose(STATE.avatar, STATE.poseId);

  setTimeout(() => {
    preloadAllPoses(STATE.avatar).then(() => {
      refreshPosesGrid();
      updatePosesInfo();
      actualizarAvatar();
    });
  }, 500);

  showHint(hadSave ? 'Estado restaurado · cargando poses...' : 'Cargando poses...');

  await restoreSavedAudio();
  await restoreSavedSync();

  const p = await checkPermission();
  if (p === 'denied') {
    showPermissionHelp('🚫 Micrófono bloqueado',
      `Toca el <b>candado 🔒</b> junto a la URL y cámbialo a <b>"Permitir"</b>, luego recarga.`);
  }
}
init();

window.addEventListener('beforeunload', () => {
  if (audioLoaded && audioEl) {
    lastSavedPosition = audioEl.currentTime || 0;
    saveAudioMeta();
  }
});
window.addEventListener('pagehide', () => {
  if (audioLoaded && audioEl) {
    lastSavedPosition = audioEl.currentTime || 0;
    saveAudioMeta();
  }
});
</script>
